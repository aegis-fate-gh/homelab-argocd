---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-timescale-data
  namespace: jovian-prod
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: k8s-cephfs
  resources:
    requests:
      storage: 20Gi
 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-redis-data
  namespace: jovian-prod
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: k8s-cephfs
  resources:
    requests:
      storage: 5Gi
 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-backups
  namespace: jovian-prod
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: k8s-cephfs
  resources:
    requests:
      storage: 10Gi
