        originally_available: 2019-09-29
        summary: |
          Source: YouTube
          Creator: Alvision100
          Description: Here are some more animations I composited. Most of these renderings are NON-CANON and represent my humble vision of a fan-made universe I like to call Sky-verse. Thank you for watching! Special thanks to Ricky Wallace for his inspiration. The amazing musical score on this video is composed by Scott Buckley. I can't thank him enough for allowing the use of this track. Feel free to check out my other videos. Live long and prosper and be safe. 🖖
          Music 'Icarus' by Scott Buckley
        collection: [ Short Film, Star Trek ]
      Gran Turismo 5 Tribute to Ferrari 458 Italia:
