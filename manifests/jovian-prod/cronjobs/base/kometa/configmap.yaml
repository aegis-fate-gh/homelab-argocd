        sort_title: Gran Turismo 5 Tribute to Ferrari 458 Italia
        originally_available: 2009-09-29
        summary: |
          Source: YouTube
          Creator: Hospital Records
          Description: The "Ferrari 458 Italia" debuted at the Frankfurt Motor Show on September 2009. This is a movie made in collaboration between "Gran Turismo" and Ferrari, that explores the allure of Ferrari's newest V8 Berlinetta.
          The power output of Ferrari's first direct injection V8 unit to be mounted in their midship supercar, reaches an amazing 570ps. This next generation power performance and the flowing bodywork by Pininfarina comes together to produce a car that achieves a maximum speed of 325km/h.
