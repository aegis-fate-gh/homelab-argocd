      The 500 Series Shinkansen Nozomi Ver4:
        match:
          title: 39_500v4_090301
        sort_title: The 500 Series Shinkansen Nozomi Ver.4
        title: The 500 Series Shinkansen Nozomi Ver.4
        originally_available: 2009-03-01
        summary: |
          Source: Web
          Creator: aidusl
          Description: The 500 Series Shinkansen are the fastest, most powerful and most expensive trainsets yet to run on Japan's Shinkansen high-speed rail network. They are designed to be capable of 320 km/h (200 mph) although they operate at a maximum of 300 km/h (186 mph) in service. The running gear utilizes computer-controlled active suspension for a smoother, safer ride, and anti-yaw dampers are fitted between cars for improved stability [1]. All sixteen cars in each train are powered, giving a maximum of 18.24 MW of power (25,000 hp). Each train costs an estimated ¥5 billion. Because of that pricetag, only nine were built.
          Visually they are quite striking, with a long, pointed nose more like that of a supersonic plane than a conventional high speed train. In 1990, Hitachi commissioned Neumeister Design of Germany to create an exterior and interior design for a new Shinkansen. It became the basis for the development of the 500 Series.
          The first set was delivered for testing in 1995, entering passenger service in March 1997. The entire fleet of nine sets was delivered by 1998. Besides the premium Nozomi services and the current Kodama services, full-length trains are also currently used on Hikari Rail Star services during the busy holiday periods.
        collection: [ Shinkansen, Trains, High Speed Rail, Japan ]
