apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure_app
  namespace: jovian-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: k8s-cephfs
  resources:
    requests:
      storage: 5Gi

