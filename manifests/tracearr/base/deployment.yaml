apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  namespace: jovian-prod
  labels:
    app: tracearr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      nodeSelector:
        connection: standard
      securityContext:
        fsGroup: 1000
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:v1.0.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: TZ
              value: "America/Chicago"
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGIN
              value: "tracearr.jovian.local.sch-apps.com"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracearr-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://tracearr:$(DB_PASSWORD)@localhost:5432/tracearr"
            - name: REDIS_URL
              value: "redis://localhost:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracearr-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracearr-secrets
                  key: COOKIE_SECRET
          volumeMounts:
            - name: backups
              mountPath: /data/backup
          # Adjust the path below if Tracearr's real health endpoint differs -
          # this is an assumption, not a confirmed value.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

        - name: timescale
          image: timescale/timescaledb-ha:pg18.4-ts2.29.1
          command:
            - postgres
            - -c
            - timescaledb.license=timescale
            - -c
            - timescaledb.max_tuples_decompressed_per_dml_transaction=100000
            - -c
            - max_locks_per_transaction=4096
            - -c
            - timescaledb.telemetry_level=off
            - -c
            - max_connections=150
          env:
            - name: POSTGRES_USER
              value: "tracearr"
            - name: POSTGRES_DB
              value: "tracearr"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracearr-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: timescale-data
              mountPath: /home/postgres/pgdata/data
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tracearr"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tracearr"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
 
        - name: redis
          image: redis:8-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
